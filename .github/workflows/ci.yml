name: CI

permissions:
  contents: read

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: "17 6 * * 1"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "stable"
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --all-features

      - name: Install semver-check toolchain
        if: github.event_name == 'pull_request'
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.95.0"

      - name: Semver check
        if: github.event_name == 'pull_request'
        run: |
          cargo install cargo-semver-checks --locked || true
          cargo semver-checks

  msrv:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - rust: "1.80.0"
            features: ""
          - rust: "1.83.0"
            features: "--features store"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ matrix.rust }}
      - name: Check fresh consumer on Rust 1.83.0
        if: matrix.rust == '1.83.0'
        run: |
          consumer="$RUNNER_TEMP/consumer"
          cargo +1.83.0 new --lib "$consumer"
          cd "$consumer"
          cargo +1.83.0 add gramdex --path "$GITHUB_WORKSPACE" --features store
          cargo +1.83.0 check
      - name: Resolve dependencies for the declared Rust version
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          cargo +1.85.0 generate-lockfile
      - name: Check library MSRV
        run: cargo check --locked --lib ${{ matrix.features }}
